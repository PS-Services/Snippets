# Run apps -CheckOnly, apps -WhatIf, or apps to install missing programs.
# Override with $env:SnippetsProgramsYaml or apps -Path C:\Config\programs.yml.
# Set active: false to skip an entry without deleting it (defaults to true).
# Required runs first. Failed required entries block Optional installations.
# Installing Chocolatey requires an administrator PowerShell session.
Required:
  - id: winget
    name: WinGet
    source: bootstrap
    active: true
  - id: scoop
    name: Scoop
    source: bootstrap
    active: true
  - id: choco
    name: Chocolatey
    source: bootstrap
    active: true

Optional:
  - id: main/nvm
    name: NVM
    source: scoop
    active: true
